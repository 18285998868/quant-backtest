# 单次回测配置示例。复制后修改。
# 相对路径按运行命令时的 cwd 解析。

[run]
# 规范 CSV;与顶层 [source] 二选一
data = "fixtures/sma_6bars.csv"
initial_cash = 100000.0
start = "2020-01-01T00:00:00Z"
end = "2020-01-07T00:00:00Z"
output_dir = "out/sma"
# auto 或正整数
threads = "auto"
# 0 表示自动检测
memory_limit_gb = 0
# 分块窗口 bar 数;0 表示只在显式内存上限且全量超限时自动分块
chunk_bars = 0
# 支持 1m/5m/15m/30m/1h/4h/1d/1w;一个文件只放一个周期
timeframe = "1d"
risk_free_rate = 0.0

# 归档直连:删除上面的 run.data,取消下面一段注释。
# 需要同级克隆 data-reader;root 是下载器输出目录。
# [source]
# kind = "binance"
# root = "../data/binance"
# market = "spot"       # spot / futures/um / futures/cm
# funding = true        # 仅期货可设;省略时期货开启、spot 关闭

# [source]
# kind = "dukascopy"
# root = "../data"      # 其下含 dukascopy/{symbol}/...
# price_type = "bid"    # 可选,默认 bid

[execution]
# 0 表示不限制；1.0 表示最多吃掉 bar.volume
participation_rate = 0.0

[strategy]
name = "sma_cross"
fast = 2
slow = 3
# 目标名义价值 / 权益
weight = 0.99
allow_short = false

# 截面动量示例:替换上面的 [strategy] 段
# [strategy]
# name = "xs_momentum"
# lookback = 20
# top_k = 2
# rebalance_bars = 5
# weighting = "inverse_vol"   # 或 "equal"
# vol_lookback = 20
# vol_floor = 0.0001
# gross = 1.0

# 可选:止损/止盈,trigger 为 intrabar 或 close
# [risk.stop_loss]
# trigger = "intrabar"
# distance = 0.05
#
# [risk.take_profit]
# trigger = "close"
# distance = 0.10

# 可选:参数扫描,配合 `sweep --config <sweep.toml>` 使用
# [sweep]
# objective = "sharpe"   # 或 "cagr" / "calmar"
# top_k = 20
# oos_split = 0.7
#
# [sweep.grid]
# fast = [2, 4, 8]
# slow = [10, 20, 30]
# weight = [0.5, 0.9]

[[instruments]]
symbol = "TEST"
asset_class = "crypto"
currency = "USD"
multiplier = 1.0
lot_size = 0.0
margin_rate = 1.0
fee_bps = 0.0
fee_fixed = 0.0
slippage_bps = 0.0
periods_per_year = 365
