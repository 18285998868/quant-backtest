# 周线冒烟:合成 16 根周线,验证周线年化与报告。
[run]
data = "fixtures/weekly.csv"
initial_cash = 100000.0
start = "2020-01-01T00:00:00Z"
end = "2020-05-01T00:00:00Z"
output_dir = "target/smoke-m1-1w"
threads = "auto"
memory_limit_gb = 0
timeframe = "1w"

[execution]
participation_rate = 0.0

[strategy]
name = "sma_cross"
fast = 2
slow = 3
weight = 0.99
allow_short = false

[[instruments]]
symbol = "TEST"
asset_class = "crypto"
currency = "USD"
multiplier = 1.0
lot_size = 0.0
margin_rate = 1.0
fee_bps = 0.0
fee_fixed = 0.0
slippage_bps = 0.0
