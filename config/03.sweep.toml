[run]
data = "fixtures/sma_6bars.csv"
initial_cash = 100000.0
start = "2020-01-01T00:00:00Z"
end = "2020-01-07T00:00:00Z"
output_dir = "target/smoke-s4"
threads = "auto"
memory_limit_gb = 0
timeframe = "1d"

[execution]
participation_rate = 0.0

[sweep]
objective = "cagr"
top_k = 3
oos_split = 0.7

[sweep.grid]
fast = [1, 2, 3]
slow = [2, 3, 4]
weight = [0.5, 0.9, 0.99]

[strategy]
name = "sma_cross"
fast = 2
slow = 3
weight = 0.99
allow_short = false

[[instruments]]
symbol = "TEST"
asset_class = "crypto"
currency = "USD"
multiplier = 1.0
lot_size = 0.0
margin_rate = 1.0
fee_bps = 0.0
fee_fixed = 0.0
slippage_bps = 0.0
periods_per_year = 365
